<div class="game-wrapper">
  
  <div class="sidebar">
    <div 
      *ngFor="let tile of availableTiles" 
      class="sidebar-tile"
      [class.selected]="selectedTile === tile"
      (click)="selectFromSidebar(tile)">
      {{ tile.value }}
    </div>
  </div>

  <div class="board">
    <div 
      *ngFor="let cell of gridCells" 
      class="grid-cell"
      [style.left.px]="(cell.col * 105) + 10"
      [style.top.px]="(cell.row * 105) + 10"
      (click)="placeOnBoard(cell.row, cell.col)">
    </div>

    <div 
      *ngFor="let tile of currentTiles; trackBy: trackByTile" 
      class="tile" 
      [class.empty]="tile.value === 0"
      [style.transform]="'translate(' + (tile.col * 105) + 'px, ' + (tile.row * 105) + 'px)'"
      (click)="returnToSidebar(tile)">
      {{ tile.value !== 0 ? tile.value : '' }}
    </div>
  </div>
</div>

<div class="controls">

  <label>
    Goal State
    <input type="text" [(ngModel)]="goalText" placeholder="1 2 3 4 5 6 7 8 0" />
  </label>

  <a routerLink="/">Back to menu</a>
  <a class="start-button" (click)="solvePuzzle()">Solve</a>
</div>
