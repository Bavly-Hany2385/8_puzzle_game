<div class="game-wrapper">
  
  <div class="sidebar">
    <div 
      *ngFor="let tile of availableTiles" 
      class="sidebar-tile"
      [class.selected]="selectedTile === tile"
      (click)="selectFromSidebar(tile)">
      {{ tile.value }}
    </div>
  </div>

  <div class="board">
    <div 
      *ngFor="let cell of gridCells" 
      class="grid-cell"
      [style.left.px]="(cell.col * 105) + 10"
      [style.top.px]="(cell.row * 105) + 10"
      (click)="placeOnBoard(cell.row, cell.col)">
    </div>

    <div 
      *ngFor="let tile of currentTiles; trackBy: trackByTile" 
      class="tile" 
      [class.empty]="tile.value === 0"
      [style.transform]="'translate(' + (tile.col * 105) + 'px, ' + (tile.row * 105) + 'px)'"
      [style.transition-duration.ms]="transitionMs"
      (click)="returnToSidebar(tile)">
      {{ tile.value !== 0 ? tile.value : '' }}
    </div>
  </div>
</div>

<div class="controls">

  <div class="goal-row">
    <label>
      Goal State
      <input type="text" [(ngModel)]="goalText" placeholder="1 2 3 4 5 6 7 8 0" />
    </label>

    @if (goalPreview.length) {
      <div class="goal-preview" title="Goal state">
        @for (v of goalPreview; track v) {
          <span [class.e]="v === 0">{{ v || '' }}</span>
        }
      </div>
    }
  </div>

  <div class="gen-row">
    <button (click)="generateRandomStart()" [disabled]="isRunning">Random start</button>
    <button (click)="generateRandomGoal()" [disabled]="isRunning">Random goal</button>
  </div>

  <label>
    Speed ({{ stepMs }} ms / step)
    <input type="range" min="1" max="10" step="1" [(ngModel)]="speed" />
  </label>

  <a routerLink="/">Back to menu</a>
  <a class="start-button" (click)="solvePuzzle()">Solve</a>
  <button (click)="showTree = !showTree" [disabled]="!searchTree.length">
  {{ showTree ? 'Hide' : 'Show' }} search tree
  </button>

  <div class="modal-backdrop" *ngIf="showTree" (click)="showTree = false">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Search tree ({{ searchTree.length }} nodes)</h3>
      <button class="close-btn" (click)="showTree = false">✕</button>
    </div>
    <app-search-tree class="modal-body" [nodes]="searchTree" [goal]="goalArray"></app-search-tree>
  </div>
  </div>
</div>
