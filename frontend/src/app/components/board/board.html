<div class="board">
  <div 
    *ngFor="let tile of currentTiles ;trackBy: trackByTile" 
    class="tile" 
    [class.empty]="tile.value === 0"
    [style.transform]="'translate(' + (tile.col * 105) + 'px, ' + (tile.row * 105) + 'px)'">
    {{ tile.value !== 0 ? tile.value : '' }}
  </div>
</div>

<div class="controls">
  <label>
    Initial State
    <input type="text" [(ngModel)]="startText" placeholder="1 2 5 3 4 0 6 7 8" />
  </label>

  <label>
    Goal State
    <input type="text" [(ngModel)]="goalText" placeholder="1 2 3 4 5 6 7 8 0" />
  </label>

  <label>
   Algorithm
    <select [(ngModel)]="algorithm">
      <option value="bfs">BFS</option>
      <option value="dfs">DFS</option>
      <option value="iterative_deepening">Iterative Deepening</option>
      <option value="a_star">A*</option>
    </select>
  </label>
<label *ngIf="algorithm === 'a_star'">
  Heuristic
  <select [(ngModel)]="heuristic">
    <option value="manhattan">Manhattan</option>
    <option value="euclidean">Euclidean</option>
  </select>
</label>
  <a class="start-button" (click)="solvePuzzle()">Solve</a>
</div>
